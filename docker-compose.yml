# Local development Postgres. Neon is production only and is never used here.
# Start: bun run db:local:up   Stop: bun run db:local:down
# Creates harrylever_portfolio (dev) and harrylever_portfolio_test (tests).
services:
  postgres:
    image: postgres:16-alpine
    container_name: harrylever-portfolio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: harrylever_portfolio
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d harrylever_portfolio"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
